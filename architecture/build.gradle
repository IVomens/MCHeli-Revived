// The architecture rules of docs/ARCHITECTURE_RULES.md, checked over the code of every module. The
// tests read compiled classes and sources from disk, so this module needs no Minecraft.
plugins {
    id 'mcheli.java-conventions'
}

/** Modules whose main sources are measured by the size rules. */
def checkedModules = [':core', ':api', ':common', ':neoforge', ':fabric']
/** The vehicle component graph, generated by writeComponentGraph. */
def componentsDoc = rootProject.file('docs/COMPONENTS.md')

configurations {
    // The compiled classes of the loader modules. Each holds the whole mod as it ships: the shared
    // modules compiled together with the loader glue.
    checkedClasses {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
        attributes {
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
            attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
            attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE,
                    objects.named(LibraryElements, LibraryElements.CLASSES))
        }
    }
}

dependencies {
    checkedClasses project(':neoforge')
    checkedClasses project(':fabric')

    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
    testImplementation libs.archunit
    testImplementation libs.javaparser
}

test {
    var mainSources = files(checkedModules.collect { project(it).file('src/main/java') })

    // The rules read the compiled main classes and the main sources directly.
    inputs.files(configurations.checkedClasses)
            .withPropertyName('mainClasses')
            .withNormalizer(ClasspathNormalizer)
    inputs.files(mainSources)
            .withPropertyName('mainSources')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    systemProperty 'architecture.mainSources', mainSources.asPath
    // The generated component graph the tests compare against the classes.
    inputs.file(componentsDoc).withPropertyName('componentsDoc').optional()
    systemProperty 'architecture.componentsDoc', componentsDoc.absolutePath
    // Resolved when the tests start, after the classes are built.
    var checkedClasses = configurations.checkedClasses
    jvmArgumentProviders.add({
        ["-Darchitecture.mainClasses=${checkedClasses.asPath}".toString()]
    } as CommandLineArgumentProvider)
}

// docs/COMPONENTS.md, the vehicle components' dependency graph per vehicle kind, written from the
// compiled classes. The tests fail while the committed file is stale.
tasks.register('writeComponentGraph', JavaExec) {
    group = 'documentation'
    description = 'Writes the vehicle component graph to docs/COMPONENTS.md.'
    dependsOn configurations.checkedClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.ivomens.mcheli.architecture.ComponentGraphDoc'
    systemProperty 'architecture.componentsDoc', componentsDoc.absolutePath
    var checkedClasses = configurations.checkedClasses
    jvmArgumentProviders.add({
        ["-Darchitecture.mainClasses=${checkedClasses.asPath}".toString()]
    } as CommandLineArgumentProvider)
}

// Nothing to ship: the module only has tests.
tasks.named('jar') {
    enabled = false
}

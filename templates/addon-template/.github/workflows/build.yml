name: Build

# Builds both jars on every push and pull request, and keeps them as a download on the run's page.
# Add "./gradlew :neoforge:runGameTestServer :fabric:runGameTestServer" to the build step to run the game
# tests here as well.

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Upload the jars
        uses: actions/upload-artifact@v4
        with:
          name: jars-${{ github.sha }}
          path: |
            neoforge/build/libs/*.jar
            fabric/build/libs/*.jar
          retention-days: 14

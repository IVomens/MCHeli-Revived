pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.fabricmc.net/' }
    }
}

plugins {
    // downloads Java 21 when it is not installed
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = 'exampleaddon'

// common: the addon's code and resources, compiled against vanilla Minecraft and the MCHeli API alone.
// neoforge and fabric: the loader entry points; each compiles common's sources in and builds its loader's jar.
// renameTemplate runs without them, so it works before MCHeli's jars can be downloaded (Loom resolves while
// it configures).
if (!gradle.startParameter.taskNames.any { it.endsWith('renameTemplate') }) {
    include 'common', 'neoforge', 'fabric'
}

modLoader="javafml"
loaderVersion="[4,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

# MCHeli: Revived must be installed; the API's classes come from its jar.
[[dependencies.${mod_id}]]
    modId="mcheli"
    type="required"
    versionRange="${mcheli_version_range}"
    # the content pack is found through META-INF/services, so no ordering is needed for it
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="[${minecraft_version}]"
    ordering="NONE"
    side="BOTH"

org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# ---- Your addon. ./gradlew renameTemplate -PmodId=... -Ppackage=... -PmodName=... rewrites the first three
# and the sources.
mod_id=exampleaddon
mod_name=Example Addon
mod_group=com.example.exampleaddon
mod_version=1.0.0
# Pick a license and put its text in LICENSE (see README.md). This string goes into the mod metadata.
mod_license=All-Rights-Reserved
mod_authors=Your name
mod_description=An addon for MCHeli: Revived.

# ---- MCHeli: Revived. The API and the mod have separate versions (MCHeli's docs/API.md, "Versioning").
# The API jar the addon compiles against (compileOnly, never bundled).
mcheli_api_version=1.0.0
# The MCHeli mod jar the development runs load (never bundled).
mcheli_version=2.0.0
# The MCHeli versions the addon accepts, in neoforge.mods.toml and fabric.mod.json. Use the first MCHeli
# release that has the API version above.
mcheli_version_range=[2.0.0,)
mcheli_fabric_version_range=>=2.0.0
# The SnakeYAML version inside MCHeli's jar; Fabric development runs need it on the class path.
snakeyaml_version=2.5
# Where com.ivomens.mcheli comes from: "maven" (the default: the API from MCHeli's public Maven repository, the
# mod jars from its GitHub releases) or "local" (both from ~/.m2, filled by ./gradlew publishToMavenLocal in an
# MCHeli checkout; for versions not released yet). For one build: ./gradlew build -Pmcheli_repo=local
mcheli_repo=maven

# ---- Minecraft and the loaders: the versions MCHeli: Revived itself builds with.
minecraft_version=1.21.1
neo_version=21.1.265
neo_version_range=[21.1.0,)
# the vanilla build (NeoForm) the common module compiles against
neo_form_version=1.21.1-20240808.144430
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
fabric_loader_version=0.20.1
fabric_api_version=0.116.17+1.21.1

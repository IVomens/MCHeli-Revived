# A rocket with two addon effects (mcheli_gametest:recorder) that write down the hooks they hear; the first
# cancels the explosion, so the floor it hits stays whole.
DisplayName: API test recorded rocket
Type: rocket
BaseDamage: 1
ProjectileEffects:
- Id: mcheli_gametest:recorder
  Tag: a
  Cancel: true
- Id: mcheli_gametest:recorder
  Tag: b
Ballistics:
  Acceleration: 1.0
  Gravity: 0.0
Explosion:
  Power: 3
Sound:
  Locations:
    Fire: mcheli:gun_h3_snd
Ammo:
  ReloadTime: 40
  MagSize: 4
  MaxAmmo: 40
FireCooldown: 10

# A beam-riding missile: it flies along the gunner's line of sight, steered by the addon's guidance law
# (ExampleBehaviours, mcheli_example:beam_rider) instead of the rocket's own (none). It needs no lock, and flares
# and chaff do not fool it. The airframe still limits it: TurningFactor is how fast it can turn.
DisplayName: Example beam-riding missile
Type: rocket
BaseDamage: 40
Guidance:
  Id: mcheli_example:beam_rider
  Lead: 8
  MaxRange: 400
Ballistics:
  Acceleration: 2.0
  Gravity: 0.0
Missile:
  TurningFactor: 0.25
  LockOn:
    Delay: 2
Explosion:
  Power: 3
Sound:
  Volume: 3.0
  Locations:
    Fire: mcheli:gun_h3_snd
Ammo:
  ReloadTime: 100
  MagSize: 2
  MaxAmmo: 8
  ResupplyCount: 2
  AmmoItems:
  - Count: 1
    Name: minecraft:iron_ingot
    Meta: 0
FireCooldown: 20
